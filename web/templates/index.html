<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Estación de Medición</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <script src="https://cdn.socket.io/4.8.3/socket.io.min.js" integrity="sha384-kzavj5fiMwLKzzD1f8S7TeoVIEi7uKHvbTA3ueZkrzYq75pNQUiUi6Dy98Q3fxb0" crossorigin="anonymous"></script>
    </head>
    <body>
        <p>Última actualización: <span id="ultima-actualizacion">-</span></p>
        <div class="div-output">
            <p>Mediciones en tiempo real</p>
            <div class="div-measurements">
                <p>Valor del sensor: <span id="dato-sensor">Esperando datos...</span></p>
            </div>
        </div>

        <script>
            const socket = io();

            socket.on('connect', function() {
                console.log("¡Conectado exitosamente al servidor Flask!");
                document.getElementById('dato-sensor').innerText = "Conectado, esperando datos...";
            });

            socket.on('disconnect', function() {
                console.log("Desconectado del servidor");
                document.getElementById('dato-sensor').innerText = "Sin conexión al servidor";
            });

            socket.on('connect_error', function(error) {
                console.error("Error de conexión:", error);
                document.getElementById('dato-sensor').innerText = "Error de conexión";
            });

            socket.on('actualizar_sensor', function(data) {
                console.log("Dato recibido:", data);
                document.getElementById('dato-sensor').innerText = data.valor;
                document.getElementById('ultima-actualizacion').innerText = new Date().toLocaleTimeString();
            });
        </script>
    </body>
</html>
